version: 2
project_name: ghl
dist: go/dist/release

before:
  hooks:
    - pnpm install --frozen-lockfile
    - pnpm exec vite build --mode go
    - touch go/cmd/ghl/assets/.gitkeep
    - node scripts/release-notices.ts
    - task desktop:build BUILD_VERSION={{ .Version }} BUILD_COMMIT={{ .FullCommit }} BUILD_DATE={{ .CommitDate }}
    - python3 desktop/release.py notices

builds:
  - id: ghl
    dir: go
    main: ./cmd/ghl
    binary: ghl
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - >-
        -s -w
        -X github.com/vmaerten/ghl/internal/app.version={{ .Version }}
        -X github.com/vmaerten/ghl/internal/app.commit={{ .FullCommit }}
        -X github.com/vmaerten/ghl/internal/app.buildDate={{ .CommitDate }}

archives:
  - id: ghl
    ids: [ghl]
    formats: [tar.gz]
    name_template: 'ghl_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    builds_info:
      mtime: '{{ .CommitDate }}'
    files:
      - src: LICENSE
        info:
          mtime: '{{ .CommitDate }}'
      - src: .task/release/THIRD_PARTY_NOTICES.txt
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'

  - id: desktop
    meta: true
    formats: [zip]
    # Meta archives have no build target; the native Task build is macOS ARM64.
    name_template: 'ghl-desktop_{{ .Version }}_darwin_arm64'
    files:
      - src: .task/desktop/ghl Desktop.app/Contents/Info.plist
        dst: ghl Desktop.app/Contents
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'
      - src: .task/desktop/ghl Desktop.app/Contents/MacOS/ghl-desktop
        dst: ghl Desktop.app/Contents/MacOS
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'
      - src: .task/desktop/ghl Desktop.app/Contents/Resources/AppIcon.icns
        dst: ghl Desktop.app/Contents/Resources
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'
      - src: .task/desktop/ghl Desktop.app/Contents/_CodeSignature/CodeResources
        dst: ghl Desktop.app/Contents/_CodeSignature
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'
      - src: LICENSE
        info:
          mtime: '{{ .CommitDate }}'
      - src: .task/desktop/THIRD_PARTY_NOTICES.txt
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: '{{ .Version }}-next-{{ .ShortCommit }}'

# Publish the exact locally verified archive manually, without rebuilding.
# Direct invocations and snapshots never publish or need a release token.
release:
  disable: true
changelog:
  disable: true
