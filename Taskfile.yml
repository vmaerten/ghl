version: '3'

vars:
  AIR_VERSION: v1.62.0

tasks:
  wails:build:
    desc: Build the usable macOS desktop prototype (separate from ghl)
    preconditions:
      - sh: '[ "{{OS}}" = darwin ]'
        msg: This desktop prototype currently targets macOS
    cmds:
      - pnpm exec vite build --mode go --outDir ../poc/wails/assets
      - touch poc/wails/assets/.gitkeep
      - mkdir -p '.task/wails/ghl Prototype.app/Contents/MacOS'
      - >-
        CGO_ENABLED=1 CGO_LDFLAGS='-framework UniformTypeIdentifiers'
        go -C poc/wails build -tags production -trimpath -ldflags='-s -w'
        -o '../../.task/wails/ghl Prototype.app/Contents/MacOS/ghl-desktop' .
      - cp poc/wails/Info.plist '.task/wails/ghl Prototype.app/Contents/Info.plist'
      - codesign --force --deep --sign - '.task/wails/ghl Prototype.app'

  wails:run:
    desc: Build and open a review in the reusable prototype window
    cmds:
      - task: wails:build
      - "'.task/wails/ghl Prototype.app/Contents/MacOS/ghl-desktop' {{.CLI_ARGS}}"

  wails:install:
    desc: Build and link ghl-desktop locally; keep the normal ghl command
    vars:
      INSTALL_DIR: '{{.BIN_DIR | default (printf "%s/.local/bin" (env "HOME"))}}'
    cmds:
      - task: wails:build
      - |
        desktop_bin={{printf "%s/ghl-desktop" .INSTALL_DIR | shellQuote}}
        mkdir -p {{.INSTALL_DIR | shellQuote}}
        if [ -e "$desktop_bin" ] && [ ! -L "$desktop_bin" ]; then
          echo "Cannot replace existing file or directory: $desktop_bin" >&2
          exit 1
        fi
        ln -sfn {{printf "%s/.task/wails/ghl Prototype.app/Contents/MacOS/ghl-desktop" .ROOT_DIR | shellQuote}} "$desktop_bin"
        printf 'installed %s\n' "$desktop_bin"

  wails:uninstall:
    desc: Remove the prototype CLI link; preserve review state
    vars:
      INSTALL_DIR: '{{.BIN_DIR | default (printf "%s/.local/bin" (env "HOME"))}}'
    cmds:
      - |
        desktop_bin={{printf "%s/ghl-desktop" .INSTALL_DIR | shellQuote}}
        if [ -L "$desktop_bin" ]; then rm "$desktop_bin"; fi

  wails:test:
    desc: Test prototype argument handling, shared backend and origin boundary
    cmds:
      - CGO_ENABLED=1 CGO_LDFLAGS='-framework UniformTypeIdentifiers' go -C poc/wails test -race ./...

  wails:smoke:
    desc: Exercise the real native window, clipboard and instance reuse on fixtures
    cmds:
      - task: wails:build
      - python3 poc/wails/smoke.py

  default:
    cmds:
      - task --list

  dev:
    desc: Start React hot reload and the Go backend watcher
    deps: [dev:tools]
    cmds:
      - task: dev:serve

  dev:serve:
    internal: true
    failfast: true
    deps: [dev:go, dev:web]

  dev:go:
    desc: Watch and restart the Go backend (default port 5181)
    deps: [dev:tools]
    dir: go
    vars:
      DEV_REPO: '{{if .REPO}}{{if isAbs .REPO}}{{.REPO}}{{else}}{{.USER_WORKING_DIR}}/{{.REPO}}{{end}}{{else}}{{.USER_WORKING_DIR}}{{end}}'
      DEV_API_PORT: '{{.BACKEND_PORT | default "5181"}}'
    env:
      GHL_DEV_REPO: '{{.DEV_REPO}}'
      GHL_DEV_BASE: '{{.BASE | default ""}}'
      GHL_DEV_BACKEND_PORT: '{{.DEV_API_PORT}}'
    preconditions:
      - sh: '{{and (regexMatch `^[0-9]+$` .DEV_API_PORT) (gt (atoi .DEV_API_PORT) 0) (le (atoi .DEV_API_PORT) 65535)}}'
        msg: BACKEND_PORT must be between 1 and 65535
      - sh: '! lsof -nP -iTCP:{{.DEV_API_PORT}} -sTCP:LISTEN -t >/dev/null'
        msg: Backend port {{.DEV_API_PORT}} already in use; choose BACKEND_PORT
    cmds:
      - ../.task/bin/air -c .air.toml

  dev:web:
    desc: Serve React with Vite, proxying to the development Go backend
    vars:
      DEV_REPO: '{{if .REPO}}{{if isAbs .REPO}}{{.REPO}}{{else}}{{.USER_WORKING_DIR}}/{{.REPO}}{{end}}{{else}}{{.USER_WORKING_DIR}}{{end}}'
      DEV_PORT: '{{.PORT | default "5180"}}'
      DEV_API_PORT: '{{.BACKEND_PORT | default "5181"}}'
      REPO_ROOT:
        sh: |
          dev_repo_root=$(git -C {{.DEV_REPO | shellQuote}} rev-parse --show-toplevel) || exit 1
          cd "$dev_repo_root"
          pwd -P
      REPO_ID: '{{base .REPO_ROOT}}-{{substr 0 7 (sha1sum .REPO_ROOT)}}'
      REVIEW_PATH: '/r/{{.REPO_ID | urlquery | replace "+" "%20"}}{{if .BASE}}?base={{.BASE | urlquery}}{{end}}'
    env:
      GHL_DEV_API: 'http://127.0.0.1:{{.DEV_API_PORT}}'
    cmds:
      - cmd: |
          until curl --noproxy '*' --fail --silent --max-time 1 "$GHL_DEV_API/api/health" >/dev/null; do sleep 0.1; done
        timeout: 30s
      - >-
        pnpm exec vite --mode go --host 127.0.0.1 --strictPort --port {{.DEV_PORT | shellQuote}}
        {{if and (ne (.OPEN | default "true") "false") (ne (.OPEN | default "true") "0")}}--open {{.REVIEW_PATH | shellQuote}}{{end}}

  dev:tools:
    desc: Install the pinned development watcher locally
    vars:
      GO_ROOT:
        sh: go env GOROOT
    status:
      - test -x .task/bin/air
      - .task/bin/air -v | grep -F {{.AIR_VERSION | shellQuote}}
    cmds:
      # Bypass toolchain shims that override GOBIN (including mise's Go shim).
      - GOBIN={{.ROOT_DIR | shellQuote}}/.task/bin {{.GO_ROOT | shellQuote}}/bin/go install github.com/air-verse/air@{{.AIR_VERSION}}

  build:
    desc: Build the embedded Go executable
    cmds:
      - task: build:binary
        vars: { MODE: go, COMMAND: ghl, OUTPUT: go/dist/ghl }

  run:
    desc: Build and run the default Go CLI (arguments after --)
    cmds:
      - task build >&2
      - ./go/dist/ghl {{.CLI_ARGS}}

  install:
    desc: Build and atomically install the Go CLI locally (optional BIN_DIR)
    deps: [build]
    vars:
      INSTALL_DIR: '{{.BIN_DIR | default (printf "%s/.local/bin" (env "HOME"))}}'
    cmds:
      - |
        install_dir={{.INSTALL_DIR | shellQuote}}
        mkdir -p "$install_dir"
        if [ -d "$install_dir/ghl" ]; then
          echo "Cannot replace directory: $install_dir/ghl" >&2
          exit 1
        fi
        install_tmp=$(mktemp "$install_dir/.ghl-install.XXXXXX") || exit 1
        trap 'rm -f "$install_tmp"' EXIT
        cp go/dist/ghl "$install_tmp"
        chmod 755 "$install_tmp"
        mv -f "$install_tmp" "$install_dir/ghl"
        printf 'installed %s\n' "$install_dir/ghl"

  uninstall:
    desc: Remove the locally installed CLI; preserve repository state
    vars:
      INSTALL_DIR: '{{.BIN_DIR | default (printf "%s/.local/bin" (env "HOME"))}}'
    cmds:
      - rm -f {{printf "%s/ghl" .INSTALL_DIR | shellQuote}}

  build:binary:
    internal: true
    vars:
      BUILD_VERSION:
        sh: node -p 'process.env.GHL_BUILD_VERSION ?? require("./package.json").version'
      BUILD_COMMIT:
        sh: |
          if [ "${GHL_BUILD_COMMIT+x}" ]; then
            printf '%s' "$GHL_BUILD_COMMIT"
          else
            git rev-parse HEAD | tr -d '\n'
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then printf '%s' '-dirty'; fi
          fi
      BUILD_DATE:
        sh: |
          if [ "${SOURCE_DATE_EPOCH+x}" ]; then
            case "$SOURCE_DATE_EPOCH" in ''|*[!0-9]*) echo 'Invalid SOURCE_DATE_EPOCH' >&2; exit 1;; esac
            {{if eq OS "darwin"}}date -u -r "$SOURCE_DATE_EPOCH"{{else}}date -u -d "@$SOURCE_DATE_EPOCH"{{end}} +%Y-%m-%dT%H:%M:%S.000Z
          else
            date -u +%Y-%m-%dT%H:%M:%S.000Z
          fi
      LDFLAGS: >-
        -s -w
        -X github.com/vmaerten/ghl/internal/app.version={{.BUILD_VERSION}}
        -X github.com/vmaerten/ghl/internal/app.commit={{.BUILD_COMMIT}}
        -X github.com/vmaerten/ghl/internal/app.buildDate={{.BUILD_DATE}}
    preconditions:
      - sh: '{{and (regexMatch `^[^\s''"]+$` .BUILD_VERSION) (regexMatch `^[^\s''"]+$` .BUILD_COMMIT)}}'
        msg: Invalid build version or commit (empty, whitespace or quotes)
    cmds:
      - pnpm exec vite build --mode {{.MODE | shellQuote}}
      # Vite removes the tracked placeholder while cleaning its output.
      - touch {{printf "go/cmd/%s/assets/.gitkeep" .COMMAND | shellQuote}}
      - >-
        CGO_ENABLED=0 go -C go build -trimpath -ldflags={{.LDFLAGS | shellQuote}}
        -o {{printf "../%s" .OUTPUT | shellQuote}} {{printf "./cmd/%s" .COMMAND | shellQuote}}

  test:
    desc: Test the Go runtime, API parity and embedded UI
    cmds:
      - pnpm build:node
      - task: build
      - task: test:go
      - node test/goCLI.ts
      - node test/goDaemon.ts
      - node test/goState.ts
      - node test/goPoc.ts go
      - node test/goRevisions.ts
      - node test/goImages.ts
      - node test/run.ts --go

  test:install:
    desc: Verify local Go installation and the explicit Node fallback
    cmds:
      - node test/goLocalInstall.ts

  test:go:
    desc: Run Go tests with the race detector
    dir: go
    cmds:
      - go test -race ./...

  vet:
    desc: Run Go vet
    dir: go
    cmds:
      - go vet ./...

  test:dev:
    desc: Verify React refresh, Go restart and development cleanup
    deps: [dev:tools]
    cmds:
      - node test/goDev.ts

  check:
    desc: Check types, lint, formatting and Go vet
    cmds:
      - pnpm typecheck
      - pnpm lint
      - pnpm format:check
      - task: vet

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build and verify release archives without publishing
    cmds:
      - goreleaser release --snapshot --clean
      - task: release:verify

  release:build:
    desc: Build and verify a checked-out version tag without publishing
    cmds:
      - node scripts/release-tag.ts
      - goreleaser release --skip=publish --clean
      - task: release:verify

  release:verify:
    desc: Verify checksums, archive contents, build metadata and embedded UI
    cmds:
      - node test/goRelease.ts
      - node test/releaseGuards.ts

  release:acceptance:
    desc: Run contract, lifecycle and browser suites against the release archive
    cmds:
      - node test/goAcceptance.ts

  release:bench:
    desc: Compare the extracted release executable with Node (three passes)
    cmds:
      - node test/goAcceptance.ts --bench

  release:mise:
    desc: Verify mise installation, PATH, upgrades and rollback against a local release fixture
    cmds:
      - node test/goMise.ts

  release:mise:published:
    desc: Verify a published GitHub Release through mise (VERSION=X.Y.Z, optional PREVIOUS=X.Y.Z)
    requires:
      vars: [VERSION]
    cmds:
      - node test/goMise.ts --published {{.VERSION | shellQuote}}{{if .PREVIOUS}} --previous {{.PREVIOUS | shellQuote}}{{end}}

  test:browser:install:
    desc: Install the pinned Chrome for Testing build (macOS ARM64)
    cmds:
      - node scripts/test-browser.ts

  bench:
    desc: Compare production Go and Node on shared fixtures (three passes)
    cmds:
      - pnpm build:node
      - task: build
      - python3 scripts/bench-runtime/run.py --go

  poc:build:
    desc: Build the isolated Go PoC
    cmds:
      - task: build:binary
        vars: { MODE: go-poc, COMMAND: ghl-go-poc, OUTPUT: poc/go/dist/ghl-go-poc }

  poc:test:
    desc: Test the isolated Go PoC
    cmds:
      - task: poc:build
      - task: test:go
      - node test/goPoc.ts
